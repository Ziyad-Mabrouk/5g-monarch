apiVersion: v1
kind: Service
metadata:
  name: packet-pairer-metrics-service
  namespace: open5gs
  labels:
    app: packet-pairer
    component: same-packet-pairer
    app.kubernetes.io/part-of: monarch
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/scheme: "http"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "9200"
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9200
      targetPort: 9200
      protocol: TCP
  selector:
    app: packet-pairer
    component: same-packet-pairer
    managed-by: kopf-ebpf-controller
