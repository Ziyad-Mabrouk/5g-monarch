name: Build & Push 5G-Monarch KPI Calculator image

on:
  push:
    branches: [ with_data_persistance_for_sopnodes ]
    paths:
      - 'kpi_computation/ran/standard/**'
  workflow_dispatch:

env:
  GHCR_USER: ziyad-mabrouk
  TAG: v1.0.1-standard

jobs:

  build-and-push-kpi-calculator-oai:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Log in to GHCR
      run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ env.GHCR_USER }}" --password-stdin

    - name: Build kpi-calculator-oai
      run: |
        docker build --tag kpi-calculator-oai:${{ env.TAG }} -f kpi_computation/ran/standard/Dockerfile ./kpi_computation/ran/standard

    - name: Tag and push to GHCR
      run: |
        IMAGE_URI=ghcr.io/${{ env.GHCR_USER }}/kpi-calculator-oai:${{ env.TAG }}
        docker tag kpi-calculator-oai:${{ env.TAG }} "$IMAGE_URI"
        docker push "$IMAGE_URI"

    - name: Log out of GHCR
      if: always()
      run: docker logout ghcr.io
